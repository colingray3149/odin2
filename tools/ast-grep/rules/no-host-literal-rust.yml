id: no-host-literal-rust
language: rust
severity: error
message: IP, host, or tailnet literal; declare it instead of hardcoding it
rule:
  any:
    - all:
        - any:
            - kind: string_literal
            - kind: raw_string_literal
        - regex: '\b(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\b|fd7a:115c:a1e0|\.ts\.net'
    - all:
        - any:
            - kind: string_literal
            - kind: raw_string_literal
        - regex: '\b(mini|pc|laptop|workspace)\b'
    - all:
        - pattern: Ipv4Addr::new($A, $B, $C, $D)
        - has:
            kind: integer_literal
            stopBy: end
        - not:
            pattern: Ipv4Addr::new(127, 0, 0, 1)
    - pattern: $O[0] == 100 && (64..=127).contains(&$O[1])
    - pattern: $V.octets()[..6] == [0xfd, 0x7a, 0x11, 0x5c, 0xa1, 0xe0]
