[advisories]
unmaintained = "workspace"
# webpki-roots 0.26.11 (tokio-tungstenite 0.28) is a shim that re-exports 1.x, locked at the fixed 1.0.10.
ignore = [
  { id = "RUSTSEC-2026-0381", reason = "0.26.11 only re-exports webpki-roots 1.0.10, which carries the fix" },
  { id = "RUSTSEC-2026-0459", reason = "local only: needs an attacker-written database and -wal pair; Odin opens only its own state files. Remove with the rusqlite 0.41 bump" },
]

[licenses]
allow = ["Apache-2.0", "CC0-1.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Unlicense", "Zlib"]
confidence-threshold = 0.8
# odin-brain's cssparser (and its two helpers) are MPL-2.0: file-level copyleft on unmodified upstream files.
# arrayref's BSD-2-Clause is permissive, with source and binary notice requirements.
exceptions = [
  { allow = ["BSD-2-Clause"], crate = "arrayref@0.3.9" },
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Exact skips for the extra versions in Cargo.lock. The newest of each crate
# stays unskipped, so a later duplicate still fails. Not a skip-tree.
skip = [
    { crate = "base64@0.13.1", reason = "spm_precompiled via tokenizers" },
    { crate = "bitflags@1.3.2", reason = "png 0.17 via resvg's tiny-skia; png 0.18 uses 2.x" },
    { crate = "compact_str@0.8.2", reason = "workspace pin; tokenizers uses 0.9.1" },
    { crate = "cpufeatures@0.2.17", reason = "sha1 and sha2" },
    { crate = "getrandom@0.2.17", reason = "ring and rand_core 0.6" },
    { crate = "getrandom@0.3.4", reason = "ahash and rand_core 0.9" },
    { crate = "hashbrown@0.14.5", reason = "dashmap and hashlink 0.9" },
    { crate = "hashbrown@0.15.5", reason = "sqlx-core and hashlink 0.10" },
    { crate = "hashlink@0.9.1", reason = "rusqlite" },
    { crate = "miniz_oxide@0.8.9", reason = "png" },
    { crate = "nix@0.29.0", reason = "evdev (odin-desk); zip uses 0.31" },
    { crate = "phf@0.11.3", reason = "markup5ever" },
    { crate = "phf_generator@0.11.3", reason = "phf_codegen and string_cache_codegen" },
    { crate = "phf_shared@0.11.3", reason = "markup5ever and string_cache" },
    { crate = "png@0.17.16", reason = "resvg's tiny-skia enables PNG by default; image uses 0.18" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3" },
    { crate = "rand@0.8.8", reason = "sqlx and phf_generator 0.11" },
    { crate = "rand@0.9.5", reason = "tokenizers and tungstenite" },
    { crate = "rand_chacha@0.3.1", reason = "rand 0.8" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8 and rsa" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9" },
    { crate = "redox_syscall@0.5.18", reason = "parking_lot_core" },
    { crate = "syn@2.0.119", reason = "workspace pin and older macros; clap and serde use syn 3" },
    { crate = "thiserror@1.0.69", reason = "nvml-wrapper 0.13 requires 1.x; workspace uses 2.x" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0.69 via nvml-wrapper" },
    { crate = "tokio-tungstenite@0.28.0", reason = "workspace pin; axum and kube use 0.29" },
    { crate = "tungstenite@0.28.0", reason = "tokio-tungstenite 0.28" },
    { crate = "webpki-roots@0.26.11", reason = "tokio-tungstenite 0.28 shim; 1.0.10 stays" },
    { crate = "windows-sys@0.48.0", reason = "etcetera" },
    { crate = "windows-sys@0.52.0", reason = "ring" },
    { crate = "windows-sys@0.60.2", reason = "notify" },
    { crate = "windows-targets@0.48.5", reason = "windows-sys 0.48" },
    { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52" },
    { crate = "windows_aarch64_gnullvm@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_aarch64_msvc@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_i686_gnu@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_i686_gnu@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_i686_msvc@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_i686_msvc@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_x86_64_gnu@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_x86_64_gnullvm@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_x86_64_msvc@0.48.5", reason = "windows-targets 0.48" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets 0.52" },
]

