[package]
name = "odin-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sinmara's hands on the owner's pc desktop: a uinput pointer and keyboard, niri's IPC socket and grim screenshots behind one JSON-lines channel."

[lints]
workspace = true

[dependencies]
base64.workspace = true
evdev = "0.13"
rustix = { workspace = true, features = ["event", "process"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
zbus = { version = "5", features = ["blocking-api"] }
shell-words = "1"

[dev-dependencies]
tempfile.workspace = true
