schema = "odin.registry.v1"
kind = "workload"
enabled = true
description = "Colin-owned Claude Code tab on pc. Project opens stay refused until a checkout is declared."
# claude-code selects the separate Claude driver workload schema.
harness = "claude-code"
# Account discovery kind; must be claude-code.
account_kind = "claude-code"
# Account source; discovered is the supported value.
accounts = "discovered"
# Enabled project IDs to allow; [] adds no project restriction.
projects = []
# Launch target: pod (default) or host-tab.
placement = "host-tab"
# Enabled host ID; required for host-tab and omitted for pod.
host = "pc"
# Enabled environment ID matching placement: k3s-pod or fleet-host.
environment = "claude-host-pc"
# true enables Claude remote control; false disables it.
remote_control = true
# true skips Claude permission prompts; defaults true for pod, false for host-tab.
skip_permissions = false
# Distinct MCP server IDs declared in mcp_servers; [] selects none.
mcp = ["filesystem"]

[mcp_servers.filesystem]
# Absolute filesystem-server path for this placement; worktree scope requires the admitted binary.
command = "/etc/profiles/per-user/colin/bin/mcp-server-filesystem"
# Server argv; worktree scope requires only {worktree}, expanded to the selected checkout.
args = ["{worktree}"]
# MCP scope: worktree or browser; worktree confines the filesystem server to the checkout.
scope = "worktree"
# MCP egress hostnames; worktree scope requires [].
allow_hosts = []

[image]
# platform or digest-pinned OCI image; required by schema even for host-tab.
reference = "platform"

[resources]
# Pod CPU request: positive integer cores or millicores (m); no host-tab resource enforcement.
cpu_request = "250m"
# Pod CPU limit: positive integer cores or millicores (m), at least cpu_request.
cpu_limit = "2"
# Pod memory request: positive integer with Ki/Mi/Gi/Ti/Pi/Ei suffix.
memory_request = "512Mi"
# Pod memory limit: positive binary-unit quantity, at least memory_request.
memory_limit = "4Gi"
# Pod storage limit: positive integer with Ki/Mi/Gi/Ti/Pi/Ei suffix.
storage_limit = "8Gi"

[presets.normal]
# Preset launch target: pod or host-tab.
placement = "host-tab"
# Session driver: sinmara or colin.
driver = "colin"
# true skips Claude permission prompts for this preset.
skip_permissions = true
# true enables Claude remote control for this preset.
remote_control = true
# Workspace mode; normal-checkout is the supported value.
workspace = "normal-checkout"
# Non-empty discovered account name used unless overridden.
default_account = "default"
# Enabled, enrolled host ID used unless overridden.
default_host = "pc"
# Non-empty working directory string used unless overridden.
default_dir = "~"
# true permits an unsandboxed session; false does not.
unsandboxed = true
