schema = "odin.registry.v1"
kind = "workload"
enabled = true
description = "One-shot greeting agent on the Grok lane."
# Runner: script, an enabled pod-capable harness (default omp), or the separate claude-code driver.
harness = "omp"

[image]
# platform uses the deployed image; otherwise require an OCI reference with @sha256:<digest>.
reference = "platform"

[runtime]
# Absolute in-image path to the OMP launcher.
launcher = "/odin/bin/omp"
# Absolute in-image path to the browser executable.
browser = "/odin/bin/chromium"
# Absolute in-image path to the browser supervisor executable.
supervisor = "/odin/bin/odind"
# Absolute in-image path to the Playwright module root.
playwright = "/odin/lib/playwright-core"

[seat]
# Enabled seat ID whose permissions apply to this workload.
seat = "kubert"
# Enabled project ID within the seat's project_scope.
project = "odin"
# Gateway lane ID declared by an enabled provider; selects the model route.
gateway_lane = "grok"

[network]
# Bare egress hostnames, not URLs; an empty array adds no external hosts.
allow_hosts = []

[display]
# Absolute in-image path to the Xvfb executable.
xvfb = "/odin/bin/Xvfb"
# Display width/height 1..8192 and depth 1..32, written as 1280x720x24.
screen = "1280x720x24"
# true streams the browser surface to the owner; false disables streaming.
stream = false

[state]
# Absolute in-pod path where the persistent state volume is mounted.
path = "/state"
# State volume capacity: positive integer with Ki/Mi/Gi/Ti/Pi/Ei suffix, e.g. 1Gi.
storage = "1Gi"

[export]
# Absolute in-pod directory whose files are exported.
pod_path = "/export"
# Absolute host directory receiving exported files.
host_folder = "/srv/odin/export"

[brief]
text = "Reply exactly 'hello from Astra' and finish. Do not perform any other work."

[memory]
# Project-declared atlas.* or memory.* namespace within the seat's brain_scope.
namespace = "memory.project.odin"

[lifetime]
# Job wall-clock limit in seconds, 60..86400; omit for services.
deadline_seconds = 300
