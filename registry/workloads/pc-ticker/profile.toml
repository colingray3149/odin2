schema = "odin.registry.v1"
kind = "workload"
enabled = true
description = "Ticker job on the cfd node: prints an incrementing ODIN-STATUS tick line every 20s for 30 minutes."
# Runner: script, an enabled pod-capable harness (default omp), or the separate claude-code driver.
harness = "script"
# Required node capability IDs; omitted means any eligible node.
placement = ["cfd"]

[image]
# platform uses the deployed image; otherwise require an OCI reference with @sha256:<digest>.
reference = "docker.io/library/python:3.12-slim@sha256:eeb8088e67610b37583880c7627e3931f087cba55a35810819e34a398f624a47"

[script]
# Non-empty argv array executed inside the image; required for script workloads.
command = ["python3", "-u", "-c", """import time;[(time.sleep(20),print('ODIN-STATUS {"tick": %d}'%n,flush=True)) for n in range(1,91)]"""]

[seat]
# Enabled seat ID whose permissions apply to this workload.
seat = "kubert"
# Enabled project ID within the seat's project_scope.
project = "odin"

[network]
# Bare egress hostnames, not URLs; an empty array adds no external hosts.
allow_hosts = []

[state]
# Absolute in-pod path where the persistent state volume is mounted.
path = "/state"
# State volume capacity: positive integer with Ki/Mi/Gi/Ti/Pi/Ei suffix, e.g. 1Gi.
storage = "1Gi"

[export]
# Absolute in-pod directory whose files are exported.
pod_path = "/export"
# Absolute host directory receiving exported files.
host_folder = "/srv/odin/export"

[brief]
text = 'Script pod: prints ODIN-STATUS {"tick": n} every 20 s for 30 minutes on the cfd node. No agent.'

[lifetime]
# Job wall-clock limit in seconds, 60..86400; omit for services.
deadline_seconds = 1800

[monitoring]
# Seconds between ODIN-STATUS samples; integer 5..3600.
cadence_seconds = 30
# ODIN-STATUS counter name whose increase counts as useful progress.
progress = "tick"
# Seconds without progress before recovery; 10..86400 and at least two sample intervals.
stall_seconds = 180

[monitoring.recovery]
# Enabled stall responses: restart_worker and escalate; escalate is required.
allowed_rungs = ["restart_worker", "escalate"]
# Non-empty operator guidance when no recovery action remains.
blocked_missing_decision = "If the ticker cannot make progress on the cfd node, ask Colin whether to keep or retire the pc-ticker profile."

[monitoring.recovery.max_attempts]
# retry attempt limit; integer 0..1000, used only when the rung is allowed.
retry = 1
# restart_worker attempt limit; integer 0..1000, used only when the rung is allowed.
restart_worker = 1
# checkpoint attempt limit; integer 0..1000, used only when the rung is allowed.
checkpoint = 0
# rehome attempt limit; integer 0..1000, used only when the rung is allowed.
rehome = 0
# escalate attempt limit; integer 1..1000.
escalate = 1

[monitoring.recovery.cooldown_seconds]
# retry cooldown in seconds; integer 0..31557600, zero means no delay.
retry = 30
# restart_worker cooldown in seconds; integer 0..31557600, zero means no delay.
restart_worker = 60
# checkpoint cooldown in seconds; integer 0..31557600, zero means no delay.
checkpoint = 0
# rehome cooldown in seconds; integer 0..31557600, zero means no delay.
rehome = 0
# escalate cooldown in seconds; integer 0..31557600, zero means no delay.
escalate = 0
