schema = "odin.registry.v1"
kind = "provider"
enabled = true
description = "Served embedding provider for vector/hybrid brain retrieval through the shared LiteLLM gateway; the single declared route must resolve to exactly one eligible receipt-bound projection route or no executor binds. Spend enforcement is the deployed gateway's declared cap (LiteLLM max_budget); the odin-ledger reservation/settlement tables are unwired, so this [budget] proves no consumptive ceiling by itself."
# Compiled adapter ID; litellm-gateway uses routes, other adapters require routes=[].
adapter = "litellm-gateway"

[policy]
# Ordered gateway_lane_id/gateway_model_id pairs; non-empty only for litellm-gateway.
# Lane IDs name gateway routes; model IDs use 1..256 ASCII letters/digits or . _ : - /.
routes = [
  { gateway_lane_id = "wemm-embedding", gateway_model_id = "wemm-embedding" },
]

[protocol]
# Stable protocol ID appended to the model ID as model:id.
id = "wemm-im-user-v1"
# Embedding input framing; im_user_v1 is the supported value.
framing = "im_user_v1"
# Pre-framing UTF-8 byte limit (one byte per token); integer 1..65536.
truncate_tokens = 256
# true normalizes returned vectors to unit L2 length; false leaves them unchanged.
l2_normalize = true

[budget]
# Accounting amount, 1..1000000000000000 micros (1000000 = USD 1); gateway enforces spend.
usd_micros = 30_000_000

[budget.window]
# Fixed accounting window in seconds; integer 1..315576000, not calendar months.
duration_seconds = 2_592_000


[recovery]
# Rungs: retry, restart_worker, checkpoint, rehome, escalate (required); execution order is fixed.
allowed_rungs = ["retry", "restart_worker", "checkpoint", "rehome", "escalate"]
# Non-empty operator guidance when no recovery action remains.
blocked_missing_decision = "operator must choose whether to abandon, repair, or resume the workload"

[recovery.max_attempts]
# retry attempt limit; integer 0..1000, used only when the rung is allowed.
retry = 2
# restart_worker attempt limit; integer 0..1000, used only when the rung is allowed.
restart_worker = 1
# checkpoint attempt limit; integer 0..1000, used only when the rung is allowed.
checkpoint = 1
# rehome attempt limit; integer 0..1000, used only when the rung is allowed.
rehome = 1
# escalate attempt limit; integer 1..1000.
escalate = 1

[recovery.cooldown_seconds]
# retry cooldown in seconds; integer 0..31557600, zero means no delay.
retry = 30
# restart_worker cooldown in seconds; integer 0..31557600, zero means no delay.
restart_worker = 30
# checkpoint cooldown in seconds; integer 0..31557600, zero means no delay.
checkpoint = 30
# rehome cooldown in seconds; integer 0..31557600, zero means no delay.
rehome = 60
# escalate cooldown in seconds; integer 0..31557600, zero means no delay.
escalate = 0
