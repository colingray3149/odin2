schema = "odin.registry.v1"
kind = "provider"
enabled = true
description = "Passive transcript identity for the observe harness, not an inference provider. Model transcript is a display identity only; there is no model selection, credential, gateway route or agent launch."
# Compiled adapter ID; litellm-gateway uses routes, other adapters require routes=[].
adapter = "observe"

[policy]
# Ordered gateway_lane_id/gateway_model_id pairs; non-empty only for litellm-gateway.
routes = []

[recovery]
# Rungs: retry, restart_worker, checkpoint, rehome, escalate (required); execution order is fixed.
allowed_rungs = ["escalate"]
# Non-empty operator guidance when no recovery action remains.
blocked_missing_decision = "operator must inspect the independently managed observed session"

[recovery.max_attempts]
# retry attempt limit; integer 0..1000, used only when the rung is allowed.
retry = 0
# restart_worker attempt limit; integer 0..1000, used only when the rung is allowed.
restart_worker = 0
# checkpoint attempt limit; integer 0..1000, used only when the rung is allowed.
checkpoint = 0
# rehome attempt limit; integer 0..1000, used only when the rung is allowed.
rehome = 0
# escalate attempt limit; integer 1..1000.
escalate = 1

[recovery.cooldown_seconds]
# retry cooldown in seconds; integer 0..31557600, zero means no delay.
retry = 0
# restart_worker cooldown in seconds; integer 0..31557600, zero means no delay.
restart_worker = 0
# checkpoint cooldown in seconds; integer 0..31557600, zero means no delay.
checkpoint = 0
# rehome cooldown in seconds; integer 0..31557600, zero means no delay.
rehome = 0
# escalate cooldown in seconds; integer 0..31557600, zero means no delay.
escalate = 0
