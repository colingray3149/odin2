schema = "odin.registry.v1"
kind = "slice"
inherit_seat_grants = true
enabled = true
description = "Supervisor task steering, delegation, and read-only workload and artifact observation."
variables = {}

[redirects]
out_of_scope = "NeedsPlan"

[knowledge]
required = false
atlas_sources = [
  "state.repos",
  "state.tasks",
  "memory.project.odin",
  "memory.project.rig",
]
retrieval_mode = "hybrid"
candidate_limit = 128
top_k = 16
min_score_micros = 1
chunk_tokens = 512
chunk_overlap_tokens = 64
embedding_backend = "local"

[context]
max_bundle_tokens = 196608
reserve_output_tokens = 16384
control_tokens = 8192
history_tokens = 139264
core_tokens = 2048
prefetch_tokens = 512
tool_result_tokens = 16384
tool_schema_tokens = 16384
# Carries the supervisor seat's 24_576-byte rollover brief as one item,
# plus the 64-byte marker margin (brief_fits_item_ceiling).
max_item_tokens = 24640

[tools]
deny = []

[tools.redirects]
max_http_hops = 2
allow_cross_origin = false
allow_https_downgrade = false

[live]
max_sessions_per_seat = 4
max_prompt_bytes = 262144
transfer_chunk_bytes = 1048576
max_file_bytes = 268435456
max_render_bytes = 67108864
allowed_file_media_types = ["application/pdf", "text/plain", "image/png"]
allowed_render_media_types = ["image/png", "image/jpeg", "image/svg+xml", "application/pdf"]
