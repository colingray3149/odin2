schema = "odin.registry.v1"
kind = "slice"
enabled = true
description = "Skuld judge slice: exactly the governed capabilities the judge seat admits (registry and task reads, artifact read/write, build and check runs, capsule evaluation, web search, independent knowledge review, escalation to the Sinmara coordinator, durable memory writes) over compiled host-tool handlers; the seat reviews claims and never self-certifies results."
capabilities = [
  "task.read",
  "capsule.eval.run",
  "build.run",
  "check.run",
  "seat.ask.sinmara",
  "memory.remember",
  "brain.search",
  "brain.read",
  "registry.read",
  "incident.raise",
  "artifact.write",
  "artifact.read",
  "memory.forget",
]
variables = {}
[redirects]
out_of_scope = "NeedsPlan"

[knowledge]
required = false
atlas_sources = ["memory.colin", "atlas.code", "memory.skuld-judge"]
retrieval_mode = "hybrid"
candidate_limit = 128
top_k = 16
min_score_micros = 1
chunk_tokens = 512
chunk_overlap_tokens = 64
embedding_backend = "local"

[context]
# Budgets count UTF-8 bytes (the pinned default counter; ~4 bytes per token);
# sized for bounded conversational sessions that roll over well below the window.
max_bundle_tokens = 196608
reserve_output_tokens = 16384
control_tokens = 8192
history_tokens = 139264
core_tokens = 2_048
prefetch_tokens = 512
tool_result_tokens = 16384
tool_schema_tokens = 16384
max_item_tokens = 8192

[tools]
allow = [
  "task_read",
  "capsule_eval_run",
  "build_run",
  "check_run",
  "seat_ask_sinmara",
  "memory_remember",
  "brain_search",
  "brain_read",
  "registry_read",
  "incident_raise",
  "artifact_write",
  "artifact_read",
  "memory_forget",
]
deny = []
alias_redirect = []

[tools.redirects]
max_http_hops = 2
allow_cross_origin = false
allow_https_downgrade = false

[live]
max_sessions_per_seat = 4
max_prompt_bytes = 262144
transfer_chunk_bytes = 1048576
max_file_bytes = 268435456
max_render_bytes = 67108864
allowed_file_media_types = ["application/pdf", "text/plain", "image/png"]
allowed_render_media_types = ["image/png", "image/jpeg", "image/svg+xml", "application/pdf"]
