schema = "odin.registry.v1"
kind = "slice"
enabled = true
description = "ColinRemote engineering slice: file edits, capsule evaluation, Nix build and check runs, the browser arm as the agent's eyes on the rendered app, handing work back as a seat branch, governed task delegation, registry and context reads, incidents, and escalation to the Sinmara coordinator."
capabilities = [
  "capsule.file.edit",
  "capsule.eval.run",
  "build.run",
  "check.run",
  "browser.observe",
  "browser.interact",
  "browser.consequential",
  "git.patch.propose",
  "task.create",
  "task.read",
  "context.read",
  "seat.ask.sinmara",
  "registry.read",
  "incident.raise",
  "artifact.write",
  "artifact.read",
  "memory.forget",
]
variables = {}

[redirects]
out_of_scope = "NeedsPlan"

[knowledge]
required = false
atlas_sources = ["atlas.code", "state.repos", "ops.history"]
retrieval_mode = "hybrid"
candidate_limit = 128
top_k = 16
min_score_micros = 1
chunk_tokens = 512
chunk_overlap_tokens = 64
embedding_backend = "local"

[context]
# Budgets count UTF-8 bytes (the pinned default counter; ~4 bytes per token);
# sized for bounded conversational sessions that roll over well below the window.
max_bundle_tokens = 196608
reserve_output_tokens = 16384
control_tokens = 8192
history_tokens = 139264
core_tokens = 2_048
prefetch_tokens = 512
tool_result_tokens = 16384
tool_schema_tokens = 16384
max_item_tokens = 8192

[tools]
allow = [
  "capsule_file_edit",
  "capsule_eval_run",
  "build_run",
  "check_run",
  "browser_observe",
  "browser_interact",
  "browser_consequential",
  "git_patch_propose",
  "task_create",
  "task_read",
  "context_read",
  "seat_ask_sinmara",
  "registry_read",
  "incident_raise",
  "artifact_write",
  "artifact_read",
  "memory_forget",
]
deny = []
alias_redirect = []

[tools.redirects]
max_http_hops = 2
allow_cross_origin = false
allow_https_downgrade = false

[live]
max_sessions_per_seat = 4
max_prompt_bytes = 262144
transfer_chunk_bytes = 1048576
max_file_bytes = 268435456
max_render_bytes = 67108864
allowed_file_media_types = ["application/pdf", "text/plain", "image/png"]
allowed_render_media_types = ["image/png", "image/jpeg", "image/svg+xml", "application/pdf"]
