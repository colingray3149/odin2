schema = "odin.registry.v1"
kind = "slice"
enabled = true
capabilities = [
  "task.read",
  "git.patch.propose",
  "build.run",
  "check.run",
  "capsule.eval.run",
  "capsule.file.edit",
  "seat.ask.sinmara",
  "memory.remember",
  "brain.search",
  "brain.read",
  "registry.read",
  "incident.raise",
  "artifact.write",
  "artifact.read",
  "artifact.analyze",
  "memory.forget",
  "kube.workload.create",
  "kube.workload.summarize",
  "codemap.get_architecture", "codemap.list_projects", "codemap.search_graph", "codemap.trace_path", "codemap.get_code_snippet", "codemap.query_graph", "codemap.search_code", "codemap.detect_changes",
]
variables = {}
[redirects]
out_of_scope = "NeedsPlan"

[knowledge]
required = false
retrieval_mode = "hybrid"
candidate_limit = 128
top_k = 16
min_score_micros = 1
chunk_tokens = 512
chunk_overlap_tokens = 64
embedding_backend = "local"

[context]
# Budgets count UTF-8 bytes (the pinned default counter; ~4 bytes per token);
# sized for bounded conversational sessions that roll over well below the window.
max_bundle_tokens = 196608
reserve_output_tokens = 16384
control_tokens = 8192
history_tokens = 139264
core_tokens = 2_048
prefetch_tokens = 512
tool_result_tokens = 16384
tool_schema_tokens = 16384
max_item_tokens = 8192

[tools]
allow = [
  "task_read",
  "git_patch_propose",
  "build_run",
  "check_run",
  "capsule_eval_run",
  "capsule_file_edit",
  "seat_ask_sinmara",
  "memory_remember",
  "brain_search",
  "brain_read",
  "registry_read",
  "incident_raise",
  "artifact_write",
  "artifact_read",
  "artifact_analyze",
  "memory_forget",
]
deny = []

[tools.redirects]
max_http_hops = 2
allow_cross_origin = false
allow_https_downgrade = false

[live]
max_sessions_per_seat = 4
max_prompt_bytes = 262144
transfer_chunk_bytes = 1048576
max_file_bytes = 268435456
max_render_bytes = 67108864
allowed_file_media_types = ["application/pdf", "text/plain", "image/png"]
allowed_render_media_types = ["image/png", "image/jpeg", "image/svg+xml", "application/pdf"]
