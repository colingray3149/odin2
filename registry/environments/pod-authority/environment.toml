schema = "odin.registry.v1"
kind = "environment"
enabled = true
description = "Authority k3s environment for declared driver workloads and existing harness pods. Claude driver sessions use an owned fresh clone, an isolated copy of the selected account's sign-in files, declared resources, default-deny egress and daemon-managed shutdown. The read-only git mirror supplies clones; the daemon publishes onto the session's claude/<name> branch."
transport = "k3s-pod"
seats = ["sinmara", "gungnir", "reginn"]
git_mirror = "10.0.0.11"

[observation]
channel = "events"

[pod]
allow_hosts = ["api.anthropic.com", "platform.claude.com"]
accounts = ["claude-code"]

[[watchdog]]
name = "force-push"
match = "push --force"
