schema = "odin.registry.v1"
kind = "environment"
enabled = true
description = "A sandboxed transient user unit on the authority host (mini) for an agent that runs its own tools: its home is empty but for the session's repository clone and the harness's own account state, the rest of the system is read-only, no privileges can be gained. Inside the clone it may do anything; nothing of the owner's exists for it."
transport = "fleet-host"
host = "mini"
seats = ["gungnir", "reginn"]
git_mirror = "10.0.0.11"

[observation]
channel = "events"

[sandbox]
private_home = true
