schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Transition one todo of the bound run's plan."
handler = { id = "odin_todo_update" }
input_schema = "schemas/capability/odin.todo_update.input.json"
output_schema = "schemas/capability/odin.todo_update.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_todo_update_evidence" }
