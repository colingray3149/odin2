schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Resume one suspended finite Kubernetes Job by run identity: the caller supplies the exact opaque resourceVersion observed at admission as the compare-and-swap, and the trusted runtime clears the suspend condition under operator approval and recorded idempotency."
handler = { id = "odin_kube.workload.resume" }
input_schema = "schemas/capability/kube.workload.resume.input.json"
output_schema = "schemas/capability/kube.workload.resume.output.json"
effect_class = "R3"
seat_tags = ["operator"]
# Covers the runtime's actuation bound: the declared 120s teardown window
# plus 2 bounded 30s request phases and 10s slack (190s).
timeout_seconds = 190
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "operator"
approval_decider = "declaration"
evidence_extractor = { id = "odin_kube.workload.resume_evidence" }
