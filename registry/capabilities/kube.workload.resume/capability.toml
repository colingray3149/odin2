schema = "odin.registry.v1"
toolset = "kube"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Resumes one suspended finite Job by run id, given the resourceVersion observed at admission."
handler = { id = "odin_kube.workload.resume" }
input_schema = "schemas/capability/kube.workload.resume.input.json"
output_schema = "schemas/capability/kube.workload.resume.output.json"
effect_class = "R3"
seat_tags = ["operator"]
# Covers the runtime's actuation bound: the declared 120s teardown window
# plus 2 bounded 30s request phases and 10s slack (190s).
timeout_seconds = 190
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_kube.workload.resume_evidence" }
tests = [
  "odin-cli::bin/odind kube_runtime::execution::job_verbs::resume_unsuspends_a_paused_job",
  "odin-kube reconciler::create::launch_shape_tests::a_paused_run_suspends_its_job_and_resume_starts_it_again",
  "odin-kube reconciler::recreation::deadline_tests::a_resumed_pod_keeps_the_time_it_had_left",
]
