schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read the nonblocking lifecycle truth of one delegated worker: the durable delegation row, supervisor liveness, the fixed configuration, its last answer and, with screen true, what its terminal shows now. Only the delegating parent may read a row, and a worker that cannot be proven finished is never reported completed."
handler = { id = "odin_task.read" }
input_schema = "schemas/capability/task.read.input.json"
output_schema = "schemas/capability/task.read.output.json"
effect_class = "R0"
seat_tags = ["builder", "coordinator"]
timeout_seconds = 5
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_task.read_evidence" }
