schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Submit this purchase to the vendor. Approval applies only to the specified purchase and can be used once; if no vendor connection is configured, nothing is submitted."
handler = { id = "purchase_submit" }
input_schema = "schemas/capability/purchase.submit.input.json"
output_schema = "schemas/capability/purchase.submit.output.json"
effect_class = "R3"
seat_tags = ["coordinator"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "operator"
evidence_extractor = { id = "odin_hermes_purchase_submit_evidence" }
