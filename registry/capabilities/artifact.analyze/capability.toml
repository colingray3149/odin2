schema = "odin.registry.v1"
toolset = "files"
op = "analyze"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Runs one absolute program on one shared artifact inside the session capsule. The artifact is staged read-only; the program writes only the capsule and the project's scratch. `{artifact}` in an argument is that staged path. Returns ok, mediaType, and the stdout and stderr tails."
handler = { id = "artifact_analyze" }
input_schema = "schemas/capability/artifact.analyze.input.json"
output_schema = "schemas/capability/artifact.analyze.output.json"
effect_class = "R1"
seat_tags = ["builder", "operator"]
timeout_seconds = 1260
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_artifact_analyze_evidence" }
tests = [
  "odin-cli::bin/odind coding_route::tests::admitted_artifact_analysis_runs_inside_the_capsule",
]
