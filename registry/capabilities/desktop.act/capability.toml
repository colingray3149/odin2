schema = "odin.registry.v1"
toolset = "desktop"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Does named steps on the owner's desktop when he asks: audio, media, windows by app name, launch, type, keys, click, save; prefer a named step, click only when none fits. Controls windows, apps, typing, keys, closing, structural fill and paste, drawing, audio, media and save files; the ask window and physical stop remain."
handler = { id = "desktop_act" }
input_schema = "schemas/capability/desktop.act.input.json"
output_schema = "schemas/capability/desktop.act.output.json"
effect_class = "R2"
seat_tags = ["coordinator"]
timeout_seconds = 180
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_desktop_act_evidence" }
tests = [
  "odin-desk tests::a_private_desktop_refuses_every_request_and_a_bad_line_is_an_error_reply",
]
