schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read the durable status of the lane bound to this session."
handler = { id = "odin_lane_status" }
input_schema = "schemas/capability/odin.lane_status.input.json"
output_schema = "schemas/capability/odin.lane_status.output.json"
effect_class = "R0"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_lane_status_evidence" }
