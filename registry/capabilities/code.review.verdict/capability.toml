schema = "odin.registry.v1"
toolset = "build"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Records a reviewer's verdict (approve, or changes with notes) on a change another seat asked it to review, bound to that change's exact diff digest."
handler = { id = "code_review_verdict" }
input_schema = "schemas/capability/code.review.verdict.input.json"
output_schema = "schemas/capability/code.review.verdict.output.json"
effect_class = "R1"
seat_tags = ["judge"]
timeout_seconds = 60
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_code_review_verdict_evidence" }
tests = [
  "odin-cli::bin/odind coding_route::tests::a_reviewed_hand_back_may_name_its_exact_branch",
]
