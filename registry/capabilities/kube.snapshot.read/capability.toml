schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read-only typed snapshot of the real cluster workload surface: Jobs, pods, and schedulable placement from actual watches and node allocatable, with no cluster mutation."
handler = { id = "odin_kube.snapshot.read" }
input_schema = "schemas/capability/kube.snapshot.read.input.json"
output_schema = "schemas/capability/kube.snapshot.read.output.json"
effect_class = "R0"
seat_tags = ["operator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_kube.snapshot.read_evidence" }
