schema = "odin.registry.v1"
# Sinmara calls it rarely: its fields stay behind args in her listing.
seat_ops = { sinmara = { toolset = "code", op = "changes", expose = "on_demand" } }
toolset = "code"
op = "changes"
kind = "capability"
enabled = true
implementation = "codemap"
version = 1
description = "Detect code changes. Maps a project's git changes (working tree, or since a branch or commit) to the symbols they change and the callers they affect: the blast radius of a change."
handler = { id = "odin_adapter.operation" }
input_schema = "schemas/capability/codemap.detect_changes.input.json"
output_schema = "schemas/capability/codemap.detect_changes.output.json"
effect_class = "R0"
seat_tags = ["coordinator", "builder", "judge"]
timeout_seconds = 60
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_adapter.receipt" }
tests = [
  "odin-adapter-mcp::bin/odin-adapter-mcp tests::each_declared_codemap_tool_is_served_and_a_drifted_surface_is_refused",
]
