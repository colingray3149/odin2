schema = "odin.registry.v1"
seat_ops = { kubert = { toolset = "kube", op = "pods" } }
toolset = "status"
op = "pods"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Summarize project workloads. Summarizes the pods a seat launched or its project runs (the conversation seat sees all of them), or one by run: newest first, with profile, state, launching seat, node, start and finish, and a running pod's latest status. Worth it when the owner asks which pods ran, when or where."
handler = { id = "odin_kube.workload.summarize" }
input_schema = "schemas/capability/kube.workload.summarize.input.json"
output_schema = "schemas/capability/kube.workload.summarize.output.json"
effect_class = "R0"
seat_tags = ["operator", "builder", "coordinator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_kube.workload.summarize_evidence" }
tests = [
  "odin-cli::bin/odind kube_runtime::execution::create_attach::a_summary_row_says_who_launched_a_run_and_when_it_ran",
  "odin-cli::bin/odind kube_runtime::execution::job_verbs::pause_suspends_the_job_and_the_projection_says_so",
]
