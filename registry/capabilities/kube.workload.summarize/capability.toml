schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read-only lifecycle summary of the pods a seat launched or its project runs (Colin's conversation seat sees every pod), or one by run: newest first, each with its profile, state, the seat that launched it, the node it ran on and when it started and finished, plus a running pod's status delta. Observed from the real cluster; no cluster mutation."
handler = { id = "odin_kube.workload.summarize" }
input_schema = "schemas/capability/kube.workload.summarize.input.json"
output_schema = "schemas/capability/kube.workload.summarize.output.json"
effect_class = "R0"
seat_tags = ["operator", "builder", "coordinator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_kube.workload.summarize_evidence" }
