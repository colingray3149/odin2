schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Cancels one pending reminder or wake by id; fired or unknown ids are typed refusals."
handler = { id = "reminder_cancel" }
input_schema = "schemas/capability/reminder.cancel.input.json"
output_schema = "schemas/capability/reminder.cancel.output.json"
effect_class = "R1"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_reminder_cancel_evidence" }
