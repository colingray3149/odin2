schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Records the IANA time zone the owner is in now (travel), optionally until a local end time after which the home zone returns; every clock line and reminder resolution follows it. Unknown zone names are typed refusals."
handler = { id = "time_zone_set" }
input_schema = "schemas/capability/time.zone.set.input.json"
output_schema = "schemas/capability/time.zone.set.output.json"
effect_class = "R1"
seat_tags = ["coordinator"]
timeout_seconds = 60
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_time_zone_set_evidence" }
