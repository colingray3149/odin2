schema = "odin.registry.v1"
toolset = "build"
op = "patch"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Commits every change in the session's capsule and pushes it as the branch seat/<seat>/<session> to the project's own repository, for the owner or Sinmara to review and merge; main stays untouched. Returns the branch, commit and changed files."
handler = { id = "git_patch_propose" }
input_schema = "schemas/capability/git.patch.propose.input.json"
output_schema = "schemas/capability/git.patch.propose.output.json"
effect_class = "R2"
seat_tags = ["builder"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_git_patch_propose_evidence" }
tests = [
  "odin-cli::bin/odind coding_route::tests::work_is_handed_back_as_the_session_branch",
]
