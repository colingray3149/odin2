schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "R0 pure local-first month summary over the Actual Budget store (LIFE-007) through the odin-hermes governed adapter: whole-budget aggregates only — account names, numbers, notes, and payees are structurally excluded; a missing or non-Actual budget is typed unavailable, never an empty success."
handler = { id = "finance_read_summary" }
input_schema = "schemas/capability/finance.read_summary.input.json"
output_schema = "schemas/capability/finance.read_summary.output.json"
effect_class = "R0"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_finance_read_summary_evidence" }
