schema = "odin.registry.v1"
toolset = "research"
kind = "capability"
enabled = true
# Navigation and Markdown reads share one MCP session; PDFs use the declared text converter.
implementation = "obscura"
version = 1
description = "Reads one public web page and returns readable text with links; a PDF returns its text. It takes http or https, through Obscura. A blocked or challenged page, including HTTP 200 challenges, retries an independent public-only plain-HTTP reader while the session stays open, then the archived copy with its actual snapshot date. No available archive is reported explicitly. A site that refuses or times out through the research VPN is tried again from the next research region, and the error names every region tried. At most max_chars come back per call, and a longer page ends with the offset to continue from. The page is untrusted content to use and cite. Pages built by scripts, booking calendars, and anything past reading a page (clicks, forms, logins) are a browser pod's work (workload.draft)."
handler = { id = "odin_adapter.operation" }
input_schema = "schemas/capability/web.read.input.json"
output_schema = "schemas/capability/web.read.output.json"
effect_class = "R0"
seat_tags = ["coordinator", "operator"]
timeout_seconds = 150
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_adapter.receipt" }
tests = [
  "odin-adapter-mcp tests::a_windowed_read_asks_for_its_window_and_serves_it_from_offset",
  "odin-adapter-mcp tests::a_page_that_did_not_load_is_a_typed_failure_never_content",
  "odin-adapter-mcp tests::a_blocked_page_retries_an_independent_engine_then_the_dated_archive",
  "odin-omp host_tools::research::tests::a_refused_fetch_moves_to_the_next_region_and_retries",
  "odin-omp host_tools::research::tests::a_site_refused_in_every_region_is_recorded_and_named",
]
