schema = "odin.registry.v1"
toolset = "brain"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Forgets one memory found by an exact phrase in contains (an ambiguous match lists the candidates instead), or reverses one of the seat's learning commits by commit, page and label. Worth it when the owner says something remembered is wrong or should go: quote the wrong part, forget just that, and remember his correction if he gave one."
handler = { id = "memory_forget" }
input_schema = "schemas/capability/memory.forget.input.json"
output_schema = "schemas/capability/memory.forget.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_memory_forget_evidence" }
tests = [
  "odin-hermes runtime::memory::tests::remember_and_forget_write_through_the_brain_with_a_commit_each",
  "odin-brain learn::tests::retire_removes_the_page_in_one_commit",
]
