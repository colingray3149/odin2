schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Forgets exactly one memory identified by an exact case-sensitive token or phrase in contains. Ambiguous matches are listed and refused. Alternatively, commit + page + label reverses one calling-seat learning commit, preserving unrelated later edits and refusing conflicts."
handler = { id = "memory_forget" }
input_schema = "schemas/capability/memory.forget.input.json"
output_schema = "schemas/capability/memory.forget.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_memory_forget_evidence" }
