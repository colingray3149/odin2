schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Replace the bound run's plan. The model never names a run; the invocation scope does."
handler = { id = "odin_plan_set" }
input_schema = "schemas/capability/odin.plan_set.input.json"
output_schema = "schemas/capability/odin.plan_set.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_plan_set_evidence" }
