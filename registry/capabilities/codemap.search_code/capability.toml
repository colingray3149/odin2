schema = "odin.registry.v1"
toolset = "code"
op = "grep"
kind = "capability"
enabled = true
implementation = "codemap"
version = 1
description = "Search source text. Grep-like text search over a project's indexed files, with file filters and context lines."
handler = { id = "odin_adapter.operation" }
input_schema = "schemas/capability/codemap.search_code.input.json"
output_schema = "schemas/capability/codemap.search_code.output.json"
effect_class = "R0"
seat_tags = ["coordinator", "builder", "judge"]
timeout_seconds = 60
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_adapter.receipt" }
tests = [
  "odin-adapter-mcp::bin/odin-adapter-mcp tests::each_declared_codemap_tool_is_served_and_a_drifted_surface_is_refused",
]
