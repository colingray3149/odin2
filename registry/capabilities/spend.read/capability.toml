schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Reads what the model gateway spent per day and per lane (dollars at each lane's declared price, tokens, requests) over the last days. Visibility only; no cap is enforced. No side effects."
handler = { id = "spend_read" }
input_schema = "schemas/capability/spend.read.input.json"
output_schema = "schemas/capability/spend.read.output.json"
effect_class = "R0"
seat_tags = ["coordinator"]
timeout_seconds = 60
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_spend_read_evidence" }
