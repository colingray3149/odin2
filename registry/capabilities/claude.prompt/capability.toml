schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Send a prompt through the structured pod driver; Colin-owned host tabs refuse driving."
handler = { id = "claude_prompt" }
input_schema = "schemas/capability/claude.prompt.input.json"
output_schema = "schemas/capability/claude.prompt.output.json"
effect_class = "R2"
seat_tags = ["coordinator", "builder"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_claude_prompt_evidence" }
