schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Redirect a delegated worker: a working worker gets the message mid-turn (OMP steer); a paused one resumes with it; a finished one continues with it. Only the delegating parent steers its worker."
handler = { id = "odin_task.steer" }
input_schema = "schemas/capability/task.steer.input.json"
output_schema = "schemas/capability/task.steer.output.json"
effect_class = "R1"
seat_tags = ["builder", "coordinator"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_task.steer_evidence" }
