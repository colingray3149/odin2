schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Prepares the session's pending change for independent review: snapshots its exact diff and the test.run report for that same diff as an artifact the named reviewer seat can read, and records the request. On a lane that requires independent review, git.patch.propose pushes only after that reviewer approves this exact diff."
handler = { id = "code_review_request" }
input_schema = "schemas/capability/code.review.request.input.json"
output_schema = "schemas/capability/code.review.request.output.json"
effect_class = "R1"
seat_tags = ["builder"]
timeout_seconds = 60
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_code_review_request_evidence" }
