schema = "odin.registry.v1"
toolset = "knowledge"
expose = "on_demand"
op = "delete"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Deletes content without a kept copy. Like exile, for a page, raw item or research run; needs confirm=true."
handler = { id = "knowledge_delete" }
input_schema = "schemas/capability/knowledge.delete.input.json"
output_schema = "schemas/capability/knowledge.delete.output.json"
effect_class = "R2"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_knowledge_delete_evidence" }
tests = [
  "odin-hermes runtime::knowledge::tests::each_declared_knowledge_tool_forwards_its_arguments_and_the_seat",
]
