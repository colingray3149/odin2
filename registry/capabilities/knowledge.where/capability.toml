schema = "odin.registry.v1"
toolset = "knowledge"
expose = "on_demand"
op = "where"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Finds a file on any computer. From the device catalogs (Downloads, Documents, Desktop, Pictures, Videos, Music): name, path, size, date."
handler = { id = "knowledge_where" }
input_schema = "schemas/capability/knowledge.where.input.json"
output_schema = "schemas/capability/knowledge.where.output.json"
effect_class = "R0"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_knowledge_where_evidence" }
tests = [
  "odin-hermes runtime::knowledge::tests::each_declared_knowledge_tool_forwards_its_arguments_and_the_seat",
]
