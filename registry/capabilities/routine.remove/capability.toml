schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Removes one routine of the calling conversation seat from the registry (committed onto odin main and published); it never fires again."
handler = { id = "routine_remove" }
input_schema = "schemas/capability/routine.remove.input.json"
output_schema = "schemas/capability/routine.remove.output.json"
effect_class = "R1"
seat_tags = ["coordinator"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_routine_remove_evidence" }
