schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read files, search text, or inspect git log/diff/show in an explicitly named declared project checkout; find symbol definitions or references in the session workspace or a named project checkout. Read-only, with bounded output."
handler = { id = "code_navigate" }
input_schema = "schemas/capability/code.navigate.input.json"
output_schema = "schemas/capability/code.navigate.output.json"
effect_class = "R0"
seat_tags = ["builder", "judge", "coordinator"]
timeout_seconds = 60
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_code_navigate_evidence" }
