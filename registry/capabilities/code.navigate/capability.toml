schema = "odin.registry.v1"
toolset = "code"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Navigate project code. Read files, search text, or inspect git log/diff/show in an explicitly named declared project checkout; find symbol definitions or references in the session workspace or a named project checkout. Read-only, with bounded output."
handler = { id = "code_navigate" }
input_schema = "schemas/capability/code.navigate.input.json"
output_schema = "schemas/capability/code.navigate.output.json"
effect_class = "R0"
seat_tags = ["builder", "judge", "coordinator"]
timeout_seconds = 60
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_code_navigate_evidence" }
tests = [
  "odin-cli::bin/odind coding_route::navigation::tests::checkout_reads_searches_and_git_history_without_writes_or_path_escape",
  "odin-cli::bin/odind coding_route::tests::a_code_search_with_excess_output_keeps_its_requested_leading_matches",
]
