schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Files the code-extracted text of one attachment the owner sent in his DM into the vault's generated class knowledge (<generated>/classes/<course>/<title>.md) through the confined generated-page writer and its scoping gate. Unknown intake ids and files without readable text are typed refusals."
handler = { id = "intake_file" }
input_schema = "schemas/capability/intake.file.input.json"
output_schema = "schemas/capability/intake.file.output.json"
effect_class = "R2"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_intake_file_evidence" }
