schema = "odin.registry.v1"
toolset = "status"
op = "huginn"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read live coordination state. Reads Huginn's status and snapshot: the live view of seats, sessions and devices. Read-only; an unreachable daemon is reported as unavailable."
handler = { id = "huginn_read" }
input_schema = "schemas/capability/huginn.read.input.json"
output_schema = "schemas/capability/huginn.read.output.json"
effect_class = "R0"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_huginn_read_evidence" }
tests = [
  "odin-cli::bin/odind hermes::model_route_tests::huginn_status_counts_the_live_roster_not_durable_history",
]
