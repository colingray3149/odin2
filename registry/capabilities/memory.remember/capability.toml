schema = "odin.registry.v1"
toolset = "brain"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Stores a fact or lesson in the seat's declared memory, where later sessions find it."
handler = { id = "memory_remember" }
input_schema = "schemas/capability/memory.remember.input.json"
output_schema = "schemas/capability/memory.remember.output.json"
effect_class = "R2"
seat_tags = ["builder", "coordinator", "operator", "judge"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_memory_remember_evidence" }
tests = [
  "odin-hermes runtime::memory::tests::remember_and_forget_write_through_the_brain_with_a_commit_each",
  "odin-brain learn::tests::an_added_entry_is_one_commit_with_its_provenance",
  "odin-brain learn::tests::an_outage_report_is_refused_and_the_fact_behind_it_is_kept",
]
