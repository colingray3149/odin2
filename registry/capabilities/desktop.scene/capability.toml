schema = "odin.registry.v1"
toolset = "desktop"
expose = "on_demand"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Runs several desktop, device and headless steps as one ordered scene (gaming setup, say), when the owner asks."
handler = { id = "desktop_scene" }
input_schema = "schemas/capability/desktop.scene.input.json"
output_schema = "schemas/capability/desktop.act.output.json"
effect_class = "R2"
seat_tags = ["coordinator"]
timeout_seconds = 180
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_desktop_act_evidence" }
tests = [
  "odin-desk tests::a_stopped_ask_runs_no_more_steps_until_a_new_ask_lifts_the_stop",
]
