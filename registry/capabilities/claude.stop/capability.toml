schema = "odin.registry.v1"
toolset = "claude"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Stops one Claude session the seat owns. A session holding unpushed commits stops only when discard_unpushed is set, which is for when the owner chose to lose them."
handler = { id = "claude_stop" }
input_schema = "schemas/capability/claude.stop.input.json"
output_schema = "schemas/capability/claude.stop.output.json"
effect_class = "R2"
seat_tags = ["coordinator", "builder"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_claude_stop_evidence" }
tests = [
  "odin-cli::bin/odind claude_sessions::tests::successful_stop_allows_fresh_open_with_new_identity",
]
