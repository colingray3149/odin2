schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Stop the exact owned Claude session; refuse unpushed commits unless explicitly authorized, preserving custody checks."
handler = { id = "claude_stop" }
input_schema = "schemas/capability/claude.stop.input.json"
output_schema = "schemas/capability/claude.stop.output.json"
effect_class = "R2"
seat_tags = ["coordinator", "builder"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_claude_stop_evidence" }
