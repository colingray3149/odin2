schema = "odin.registry.v1"
toolset = "claude"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Opens a Claude Code session. By default a sandboxed driver in a pod, on a declared project and account, which the seat drives with claude.prompt and reads with claude.read; it may publish only its own claude/<name> branch of that project. A host tab opens it on one of the owner's machines for him to type into. Preset normal is an ordinary Claude Code tab for him (unsandboxed, Remote Control and skip-permissions on, in dir, the project's checkout or his home, with no worktree or branch): worth it when he asks for a normal Claude Code session. The result names what opened, where and on which account."
handler = { id = "claude_open" }
input_schema = "schemas/capability/claude.open.input.json"
output_schema = "schemas/capability/claude.open.output.json"
effect_class = "R2"
seat_tags = ["coordinator", "builder"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_claude_open_evidence" }
tests = [
  "odin-cli::bin/odind claude_sessions::tests::duplicate_open_uses_same_receipt_before_and_after_restart",
]
