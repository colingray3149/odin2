schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "R0 bounded snapshot of the retrieval-eligible SilverBullet vault pool through the odin-hermes governed adapter: page names, content digests, and sizes only — page text flows through the M11 brain index; namespace scoping is configuration-only, and a missing or unhealthy vault service is typed unavailable."
handler = { id = "vault_search" }
input_schema = "schemas/capability/vault.search.input.json"
output_schema = "schemas/capability/vault.search.output.json"
effect_class = "R0"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_vault_search_evidence" }
