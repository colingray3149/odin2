schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read a canonical brain citation through the existing execution, scope, and freshness checks."
handler = { id = "odin_brain.read" }
input_schema = "schemas/capability/brain.read.input.json"
output_schema = "schemas/capability/brain.read.output.json"
effect_class = "R0"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_brain.read_evidence" }
