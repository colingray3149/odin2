schema = "odin.registry.v1"
toolset = "brain"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Opens one brain item by the brain:// citation a search gave, a page at a time. The session's scope and freshness checks apply. Returns the item's content as reference data."
handler = { id = "odin_brain.read" }
input_schema = "schemas/capability/brain.read.input.json"
output_schema = "schemas/capability/brain.read.output.json"
effect_class = "R0"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_brain.read_evidence" }
tests = [
  "odin-omp host_tools::operations::production_operation_dispatch::dispatch_brain::governed_brain_search_and_read_dispatch_with_active_proof",
  "odin-brain::it project_memory::a_project_bound_search_never_pins_another_projects_broken_source",
]
