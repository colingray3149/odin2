schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
toolset = "status"
op = "lease_destroy"
description = "Destroy a scoped compute lease, or inspect the destruction without making a provider request."
handler = { id = "compute_lease_destroy" }
input_schema = "schemas/capability/compute.lease.destroy.input.json"
output_schema = "schemas/capability/compute.lease.destroy.output.json"
effect_class = "R3"
seat_tags = ["coordinator", "operator"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "operator"
evidence_extractor = { id = "odin_hermes_compute_lease_destroy_evidence" }
tests = ["odin-registry schema::rental_approvals::tests::lease_intent_and_reservation_are_atomic_and_replayable"]
