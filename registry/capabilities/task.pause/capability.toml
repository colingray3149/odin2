schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Pause a delegated worker at a safe point — checkpoint, end its running turn, hold further prompts — or resume it from where it stopped, or stop it for good (its session, harness and tab close). Control requires the delegating session, a session of the delegating seat, or the recorded escalation target seat; the state law refuses a control that does not apply."
handler = { id = "odin_task.pause" }
input_schema = "schemas/capability/task.pause.input.json"
output_schema = "schemas/capability/task.pause.output.json"
effect_class = "R1"
seat_tags = ["builder", "coordinator"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_task.pause_evidence" }
