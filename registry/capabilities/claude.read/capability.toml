schema = "odin.registry.v1"
toolset = "claude"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Reads a Claude session's state and its structured transcript events after a cursor."
handler = { id = "claude_read" }
input_schema = "schemas/capability/claude.read.input.json"
output_schema = "schemas/capability/claude.read.output.json"
effect_class = "R0"
seat_tags = ["coordinator", "builder"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_claude_read_evidence" }
tests = [
  "odin-cli::bin/odind claude_sessions::tests::owner_transcript_uses_the_existing_projection_and_agent_reads_remain_scoped",
]
