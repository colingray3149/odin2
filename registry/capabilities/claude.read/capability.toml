schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read durable Claude session state and structured transcript events after a cursor; never scrape a TTY."
handler = { id = "claude_read" }
input_schema = "schemas/capability/claude.read.input.json"
output_schema = "schemas/capability/claude.read.output.json"
effect_class = "R0"
seat_tags = ["coordinator", "builder"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_claude_read_evidence" }
