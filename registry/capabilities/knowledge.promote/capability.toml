schema = "odin.registry.v1"
toolset = "knowledge"
expose = "on_demand"
op = "promote"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Promotes a research run. Moves a waiting-room run into raw/research and queues it for compiling."
handler = { id = "knowledge_promote" }
input_schema = "schemas/capability/knowledge.promote.input.json"
output_schema = "schemas/capability/knowledge.promote.output.json"
effect_class = "R2"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_knowledge_promote_evidence" }
tests = [
  "odin-hermes runtime::knowledge::tests::each_declared_knowledge_tool_forwards_its_arguments_and_the_seat",
]
