schema = "odin.registry.v1"
toolset = "knowledge"
expose = "on_demand"
op = "edit"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Edits a raw file or page. mode=replace with content, or mode=patch with old and new; expected_sha256 refuses a changed file."
handler = { id = "knowledge_edit" }
input_schema = "schemas/capability/knowledge.edit.input.json"
output_schema = "schemas/capability/knowledge.edit.output.json"
effect_class = "R2"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_knowledge_edit_evidence" }
tests = [
  "odin-hermes runtime::knowledge::tests::each_declared_knowledge_tool_forwards_its_arguments_and_the_seat",
]
