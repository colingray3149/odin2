schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
toolset = "status"
op = "lease_list"
description = "List compute leases visible in the current project and lane."
handler = { id = "compute_lease_list" }
input_schema = "schemas/capability/compute.lease.list.input.json"
output_schema = "schemas/capability/compute.lease.list.output.json"
effect_class = "R0"
seat_tags = ["coordinator", "operator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_compute_lease_list_evidence" }
tests = ["odin-registry schema::rental_approvals::tests::lease_intent_and_reservation_are_atomic_and_replayable"]
