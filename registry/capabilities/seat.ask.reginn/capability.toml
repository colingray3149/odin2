schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Ask reginn: CAD and nozzle-geometry scripting: generating and refining engine/nozzle geometry, STEP/CAD handoff, and geometry toolchains in Python Work stays within the selected project's declared permissions and appears in its own terminal tab; a retry continues the same task rather than starting another."
handler = { id = "seat_ask" }
delegate_to = "reginn"
input_schema = "schemas/capability/seat.ask.input.json"
output_schema = "schemas/capability/seat.ask.output.json"
effect_class = "R3"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "operator"
approval_decider = "declaration"
evidence_extractor = { id = "odin_hermes_seat_ask_evidence" }
