schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Read one bounded UTF-8 file beneath the host-provisioned read-only operator context root; lexical, symlink, and configured-root escapes are rejected before any bytes are returned."
handler = { id = "odin_context.read" }
input_schema = "schemas/capability/context.read.input.json"
output_schema = "schemas/capability/context.read.output.json"
effect_class = "R0"
seat_tags = ["builder"]
timeout_seconds = 5
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_context.read_evidence" }
