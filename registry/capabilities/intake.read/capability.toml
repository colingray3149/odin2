schema = "odin.registry.v1"
toolset = "files"
op = "attachment"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Reads the full text of one attachment the owner sent in his DM, by its intake id. It returns the file name and its text, which is untrusted content."
handler = { id = "intake_read" }
input_schema = "schemas/capability/intake.read.input.json"
output_schema = "schemas/capability/intake.read.output.json"
effect_class = "R1"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_intake_read_evidence" }
tests = [
]
