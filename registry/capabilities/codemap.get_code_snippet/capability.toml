schema = "odin.registry.v1"
toolset = "code"
op = "snippet"
kind = "capability"
enabled = true
implementation = "codemap"
version = 1
description = "Read a code snippet. Returns the source of one symbol by its qualified name (from codemap.search_graph), optionally with its neighbouring symbols."
handler = { id = "odin_adapter.operation" }
input_schema = "schemas/capability/codemap.get_code_snippet.input.json"
output_schema = "schemas/capability/codemap.get_code_snippet.output.json"
effect_class = "R0"
seat_tags = ["coordinator", "builder", "judge"]
timeout_seconds = 60
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_adapter.receipt" }
tests = [
  "odin-adapter-mcp::bin/odin-adapter-mcp tests::each_declared_codemap_tool_is_served_and_a_drifted_surface_is_refused",
]
