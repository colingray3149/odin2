schema = "odin.registry.v1"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Reads the published registry: counts per kind, objects and their relations, or one full declaration, including a seat's projects and tool access. Read-only; secret values are not returned."
handler = { id = "registry_read" }
input_schema = "schemas/capability/registry.read.input.json"
output_schema = "schemas/capability/registry.read.output.json"
effect_class = "R0"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_registry_read_evidence" }
