schema = "odin.registry.v1"
toolset = "delegate"
op = "ask_sinmara"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Asks Sinmara, the owner-facing coordinator, for a decision: the structured question (subject, question, options) becomes one turn of her conversation; she decides or asks the owner once and sends the decision back as your next instruction. Asking needs no approval, and the same question repeated queues once."
handler = { id = "seat_ask" }
delegate_to = "sinmara"
input_schema = "schemas/capability/seat.ask.input.json"
output_schema = "schemas/capability/seat.ask.output.json"
effect_class = "R3"
seat_tags = ["builder", "coordinator", "operator", "judge"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_seat_ask_evidence" }
tests = [
  "odin-hermes::it governed_dispatch::arbitrary_declared_targets_reach_the_governed_owner_through_real_dispatch",
]
