schema = "odin.registry.v1"
toolset = "kube"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Suspends one pod Job (a finite job or a long-lived service) by run id, given the resourceVersion observed at admission."
handler = { id = "odin_kube.workload.pause" }
input_schema = "schemas/capability/kube.workload.pause.input.json"
output_schema = "schemas/capability/kube.workload.pause.output.json"
effect_class = "R3"
seat_tags = ["operator"]
# Covers the runtime's actuation bound: the declared 120s teardown window
# plus 2 bounded 30s request phases and 10s slack (190s), plus the 320s a
# checkpoint of the paused pod's state may take (520s).
timeout_seconds = 520
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_kube.workload.pause_evidence" }
tests = [
  "odin-cli::bin/odind kube_runtime::execution::job_verbs::pause_suspends_the_job_and_the_projection_says_so",
  "odin-kube reconciler::create::launch_shape_tests::a_paused_run_suspends_its_job_and_resume_starts_it_again",
]
