schema = "odin.registry.v1"
toolset = "knowledge"
expose = "on_demand"
op = "pull"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Runs a puller now. A part id from _system/parts.toml, or all; waits up to 100 s and reports its state and counts. Pages follow at the next compile. rescan=true rereads everything."
handler = { id = "knowledge_pull" }
input_schema = "schemas/capability/knowledge.pull.input.json"
output_schema = "schemas/capability/knowledge.pull.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 120
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_knowledge_pull_evidence" }
tests = [
  "odin-hermes runtime::knowledge::tests::each_declared_knowledge_tool_forwards_its_arguments_and_the_seat",
]
