schema = "odin.registry.v1"
expose = "internal"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Turns the owner's paired Discord messages into Sinmara's tasks, once each; a step that needs his yes waits at the approval gate. Messages from anyone else are dropped unanswered."
handler = { id = "discord_intake" }
input_schema = "schemas/capability/discord.intake.input.json"
output_schema = "schemas/capability/discord.intake.output.json"
effect_class = "R1"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 1 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_discord_intake_evidence" }
tests = [
  "odin-hermes::it runtime::intake_route::r1_owner_dm_answers_once_through_the_route_and_never_renders_the_receipt",
  "odin-hermes::it discord::ingress::unauthorized_owner_is_rejected_without_any_durable_record",
]
