schema = "odin.registry.v1"
toolset = "models"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Local models on mini and GPU modes of any host: list, load, unload, swap, pull from a name or link, and mode odin/kreate/gaming. Names, sizes and loaded state only."
handler = { id = "local_models" }
input_schema = "schemas/capability/local.models.input.json"
output_schema = "schemas/capability/local.models.output.json"
effect_class = "R2"
seat_tags = ["coordinator"]
timeout_seconds = 600
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_local_models_evidence" }
tests = [
  "odin-workflows local_models::tests::local_models_list_returns_the_cli_rows",
]
