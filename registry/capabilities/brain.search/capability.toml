schema = "odin.registry.v1"
toolset = "brain"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Searches your declared knowledge by meaning: notes, records, past chats and mail, transcribed media. Each hit is reference data with a brain:// citation brain.read opens. Unavailable or stale sources return an error."
handler = { id = "odin_brain.search" }
input_schema = "schemas/capability/brain.search.input.json"
output_schema = "schemas/capability/brain.search.output.json"
effect_class = "R0"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "pure"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_brain.search_evidence" }
tests = [
  "odin-omp host_tools::operations::production_operation_dispatch::dispatch_brain::governed_brain_search_and_read_dispatch_with_active_proof",
  "odin-brain index::postgres::tests::one_query_fuses_the_lexical_and_vector_legs_by_reciprocal_rank",
  "odin-brain::it project_memory::a_project_bound_search_never_pins_another_projects_broken_source",
]
