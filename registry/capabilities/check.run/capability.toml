schema = "odin.registry.v1"
toolset = "build"
op = "check"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Runs nix flake check on the session's capsule (its own clone of the project, with every change staged) in the Nix build sandbox; returns success or the log tail. Up to 20 minutes. the owner's projects are Nix flakes, so this is where their tests run: a checks output running the suite in a Nix-declared environment. A project without a flake.nix gets one first: a dev shell declaring every dependency (built from source where nixpkgs lacks it) and a checks output running its tests."
handler = { id = "check_run" }
input_schema = "schemas/capability/check.run.input.json"
output_schema = "schemas/capability/check.run.output.json"
effect_class = "R1"
seat_tags = ["builder", "judge"]
timeout_seconds = 1260
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_check_run_evidence" }
tests = [
  "odin-cli::bin/odind coding_route::tests::a_flake_check_reports_its_verdict_for_the_capsule",
]
