schema = "odin.registry.v1"
toolset = "world"
kind = "capability"
enabled = true
implementation = "workflow"
version = 1
description = "The weather in one call: today's conditions or a day's forecast (today, tomorrow, a weekday, the weekend, the week or a date), with active alerts, air quality and sunrise/sunset. No place is home."
handler = { id = "odin_workflow.run" }
input_schema = "schemas/capability/world.weather.input.json"
output_schema = "schemas/capability/world.weather.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 60
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_workflow.receipt" }
tests = [
  "odin-workflows world::tests::tomorrow_a_weekday_the_weekend_and_a_date_pick_their_days",
]
