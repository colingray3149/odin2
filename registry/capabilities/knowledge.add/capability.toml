schema = "odin.registry.v1"
toolset = "knowledge"
op = "add"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Files text or files into the inbox, or appends a project note. as=file takes text or a path ('<host>:<path>' too, 2 GB at most); as=note appends a project session note: decisions, failures, what the next session must know."
handler = { id = "knowledge_add" }
input_schema = "schemas/capability/knowledge.add.input.json"
output_schema = "schemas/capability/knowledge.add.output.json"
effect_class = "R2"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_knowledge_add_evidence" }
tests = [
  "odin-hermes runtime::knowledge::tests::each_declared_knowledge_tool_forwards_its_arguments_and_the_seat",
]
