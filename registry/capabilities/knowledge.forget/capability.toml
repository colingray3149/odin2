schema = "odin.registry.v1"
toolset = "knowledge"
expose = "on_demand"
op = "forget"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Retracts remembered lines. Appends forget: lines for every note line containing the phrase."
handler = { id = "knowledge_forget" }
input_schema = "schemas/capability/knowledge.forget.input.json"
output_schema = "schemas/capability/knowledge.forget.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_knowledge_forget_evidence" }
tests = [
  "odin-hermes runtime::knowledge::tests::each_declared_knowledge_tool_forwards_its_arguments_and_the_seat",
]
