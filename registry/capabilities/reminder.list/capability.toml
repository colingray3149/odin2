schema = "odin.registry.v1"
toolset = "calendar"
op = "reminders"
kind = "capability"
enabled = true
implementation = "builtin"
version = 1
description = "Lists pending and recent reminders and wakes in the owner's local time. No side effects."
handler = { id = "reminder_list" }
input_schema = "schemas/capability/reminder.list.input.json"
output_schema = "schemas/capability/reminder.list.output.json"
effect_class = "R0"
seat_tags = ["coordinator"]
timeout_seconds = 30
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_hermes_reminder_list_evidence" }
tests = [
  "odin-hermes::it runtime::schedule::reminders_are_set_listed_and_cancelled_in_the_owner_zone",
]
