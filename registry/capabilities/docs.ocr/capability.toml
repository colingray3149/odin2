schema = "odin.registry.v1"
toolset = "docs"
expose = "on_demand"
kind = "capability"
enabled = true
implementation = "workflow"
version = 1
description = "Make scans searchable. Supply a PDF or photo artifact/intake; returns searchable PDF and text. Languages use tesseract codes such as eng or eng+deu; redo replaces existing text. Uses OCRmyPDF."
handler = { id = "odin_workflow.run" }
input_schema = "schemas/capability/docs.ocr.input.json"
output_schema = "schemas/capability/docs.ocr.output.json"
effect_class = "R1"
seat_tags = ["*"]
timeout_seconds = 1800
idempotency = "required"
retry = { max_attempts = 0 }
approval_policy = "none"
evidence_extractor = { id = "odin_workflow.receipt" }
tests = [
  "odin-workflows docs::tests::ocr_skips_text_by_default_and_truncates_the_inline_text",
]
