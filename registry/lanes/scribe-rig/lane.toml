schema = "odin.registry.v1"
kind = "lane"
enabled = true
description = "scribe documentation work on the rig fixture project; its pushes are review-bound like any builder's"
# Existing project ID whose scope this lane belongs to.
project = "rig"
# Existing seat ID used when no seat is selected explicitly.
default_seat = "scribe"
# true requires a separate reviewer before publishing code; false does not.
requires_independent_review = true
# Reviewer capability ID; overrides the project review_verdict.
review_verdict = "code.review.verdict"
