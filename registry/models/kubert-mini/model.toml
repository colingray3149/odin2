schema = "odin.registry.v1"
kind = "model"
enabled = true
description = "Kubert's small GLM window on the Z.ai Coding account."
# The card id; everything else names the bare lane (this folder).
id = "gateway/kubert-mini"
# Upstream provider/model exactly as AVAILABLE lists it.
served = "zai/glm-5.3"
# frontier, everyday or fast-cheap.
tier = "everyday"
# Account pin holding this card's credentials.
account = "zai-coding"
# One line naming when this card is the right pick.
strengths = "Kubert's cheap pod-turn lane, bounded to a 32k window."
# True names a lane seats may run.
seats = true

[window]
# The lane's deliberate bound; the catalog supplies the rest.
context_tokens = 32_768
