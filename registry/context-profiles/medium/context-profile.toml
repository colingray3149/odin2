schema = "odin.registry.v1"
kind = "context-profile"
enabled = true
description = "Conversation and review seats: core memory plus brain context at session start and after compaction; ordinary turns carry none."
# Core memory token budget in the system prompt; integer 1..4294967295.
core_tokens = 2_048
# Retrieval token budget at session start and after compaction; integer 1..4294967295.
inject_tokens = 512
# Maximum retrieved items per context injection; integer 1..65535.
inject_k = 8
