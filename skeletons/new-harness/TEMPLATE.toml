schema = "odin.registry.v1"
kind = "harness"
enabled = "__enabled__"
description = "__description__"
# Agent interface: acp, process, terminal, or observe.
protocol = "__protocol__"
# governed routes every tool through the kernel; observed only watches.
governance = "__governance__"
# Program and fixed arguments; omit for observe.
command = "__command__"
# Prompt delivery: argv, stdin, rpc, keys, or none.
prompt = "__prompt__"
# Output format: acp, claude-stream-json, codex-json, text, or environment.
output = "__output__"
# Optional model-selection flag, such as --model.
model_arg = "__model_arg__"
# Optional argv with {agent_session} replaced by the reported session ID.
resume_args = "__resume_args__"
# Optional agent-state paths relative to HOME.
state_paths = "__state_paths__"
# Optional account kind: claude-code or codex.
account = "__account__"
# Optional instructions about running under Odin.
brief = "__brief__"

[stop]
# First stop signal: SIGINT or SIGTERM; unused for observe.
signal = "__stop_signal__"
# Seconds before SIGKILL; integer 1..300, unused for observe.
grace_seconds = "__stop_grace_seconds__"
