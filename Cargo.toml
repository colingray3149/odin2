[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
futures-core = "0.3"
hmac = "0.12"
clap = { version = "4", features = ["derive", "env"] }
jsonschema = { version = "0.33", default-features = false }
kube = { version = "=4.2.0", default-features = false, features = ["rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["latest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
mail-parser = "0.9"
html2text = "0.13"
html5ever = "0.29"
cssparser = "0.38"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std", "time"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
url = { version = "2", features = ["serde"] }
walkdir = "2"
zeroize = "1"
syn = { version = "2", features = ["full", "parsing"] }
rayon = "1"
tree-sitter = "0.27.0"
tree-sitter-typescript = "0.23.2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
axum = { version = "0.8", features = ["ws"] }
ciborium = "0.2"
futures-util = "0.3"
subtle = "2"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
compact_str = { version = "0.8", features = ["serde"] }
dashmap = "6"
odin-types = { version = "0.0.0", path = "crates/odin-types" }
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }

odin-domain = { version = "0.0.0", path = "crates/odin-domain" }
odin-atlas = { version = "0.0.0", path = "crates/odin-atlas" }
odin-browser = { version = "0.0.0", path = "crates/odin-browser" }
odin-confined-fs = { version = "0.0.0", path = "crates/odin-confined-fs" }
odin-registry = { version = "0.0.0", path = "crates/odin-registry" }
odin-ledger = { version = "0.0.0", path = "crates/odin-ledger" }
odin-kernel = { version = "0.0.0", path = "crates/odin-kernel" }
odin-kube = { version = "0.0.0", path = "crates/odin-kube" }
odin-omp = { version = "0.0.0", path = "crates/odin-omp" }
odin-huginn = { version = "0.0.0", path = "crates/odin-huginn" }
odin-adapter-core = { version = "0.0.0", path = "crates/odin-adapter-core" }
odin-brain = { version = "0.0.0", path = "crates/odin-brain" }
odin-hermes = { version = "0.0.0", path = "crates/odin-hermes" }
odin-node = { version = "0.0.0", path = "crates/odin-node" }
odin-cli = { version = "0.0.0", path = "crates/odin-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = "deny"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
panic = "abort"
strip = "symbols"
overflow-checks = false
